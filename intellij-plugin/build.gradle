plugins {
    id 'org.jetbrains.intellij.platform' version '2.18.1'
    id 'java'
}

group = 'dev.chronovault'
version = '1.0.3'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity '2024.3.1'
    }
    testImplementation 'junit:junit:4.13.2'
}

test {
    useJUnit()
    testLogging {
        events 'failed', 'skipped'
    }
}

intellijPlatform {
    pluginConfiguration {
version = '1.0.3'
        ideaVersion {
            sinceBuild = '232'
            untilBuild = '251.*'
        }
    }

    pluginVerification {
        ides {
            create('IC', '2023.2.5')
            create('IC', '2024.3.1')
        }
    }

    signing {
        def chainProp = providers.gradleProperty('signing.certChain')
        def keyProp = providers.gradleProperty('signing.privateKey')
        def passProp = providers.gradleProperty('signing.password').orElse(providers.environmentVariable('CHRONOVAULT_SIGNING_PASSWORD'))
        def chainFile = file('signing/chain.crt')
        def keyFile = file('signing/private.pem')
        certificateChain = chainProp.map { file(it).text }.getOrElse(chainFile.exists() ? chainFile.text : '')
        privateKey = keyProp.map { file(it).text }.getOrElse(keyFile.exists() ? keyFile.text : '')
        password = passProp.getOrElse('')
    }

    publishing {
        token = project.hasProperty('intellij.token') ? project.property('intellij.token') as String : ''
        channels = ['stable']
    }
}
