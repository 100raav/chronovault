plugins {
    id 'org.jetbrains.intellij.platform' version '2.18.1'
    id 'java'
}

group = 'dev.chronovault'
version = '1.0.1'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity '2024.3.1'
    }
}

intellijPlatform {
    pluginConfiguration {
        version = '1.0.1'
        ideaVersion {
            sinceBuild = '232'
            untilBuild = '251.*'
        }
    }

    pluginVerification {
        ides {
            create('IC', '2023.2.5')
            create('IC', '2024.3.1')
        }
    }

    signing {
        certificateChain = file('signing/chain.crt').text
        privateKey = file('signing/private.pem').text
        password = providers.environmentVariable('CHRONOVAULT_SIGNING_PASSWORD').getOrElse('')
    }

    publishing {
        token = project.hasProperty('intellij.token') ? project.property('intellij.token') as String : ''
        channels = ['stable']
    }
}
